<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- The splash window shown while the app starts (windows.js, "The
         splash"). Only its own files; no inline scripts or styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'"
    />

    <title>ScriBee</title>

    <!-- First, so the theme's colours are set before anything paints. -->
    <script src="splash.js"></script>
    <link rel="stylesheet" href="../node_modules/@fontsource/righteous/index.css" />
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash" role="status" aria-label="ScriBee is starting">
      <div class="logo-aura">
        <img class="logo" src="../assets/logo.webp" alt="" />
      </div>
      <h1 class="title">Scri<b>Bee</b></h1>
      <span class="loader" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
    </main>
  </body>
</html>
